name: EssentialEconomy
main: lol.oddballs.EssentialEconomy.EconomyMain
version: 3.2.0
api-version: '26.3'
author: aethyrnet
depend: [Vault]
load: STARTUP

commands:
  money:
    aliases: [economy, eco]
  balance:
    aliases: [bal]
  balancetop:
    aliases: [baltop]
  pay:

permissions:
  economy.command.balance:
    default: true
  economy.command.balancetop:
    default: true
  economy.command.help:
    default: true
  economy.command.pay:
    default: true
  economy.command.give:
    default: op
  economy.command.take:
    default: op
  economy.command.set:
    default: op
  economy.command.reload:
    default: op
  essentialeconomy.command.balance:
    default: true
  essentialeconomy.command.balancetop:
    default: true
  essentialeconomy.command.help:
    default: true
  essentialeconomy.command.pay:
    default: true
  essentialeconomy.command.give:
    default: op
  essentialeconomy.command.take:
    default: op
  essentialeconomy.command.set:
    default: op
  essentialeconomy.command.reload:
    default: op
